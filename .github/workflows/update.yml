name: Aggiorna prezzi

on:
  schedule:
    # orari UTC: mattina, subito dopo l'uscita dei prezzi di domani, sera
    - cron: "17 5 * * *"
    - cron: "37 13 * * *"
    - cron: "7 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-prezzi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica i prezzi
        timeout-minutes: 45
        run: python scripts/update.py
      - name: Salva i dati
        if: always()
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Nessuna novità" && exit 0
          git commit -m "Prezzi aggiornati $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
